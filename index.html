<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Florence · 10–13 octobre</title>
<meta name="description" content="Notre carnet de voyage à Florence : parcours à pied jour par jour, guides des musées, histoires des lieux, réservations et bonnes adresses.">
<meta name="theme-color" content="#b4532a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --fond: #f6f1e9; --carte: #fffdf9; --texte: #2a2420; --doux: #6f655c; --trait: #e4dacb;
    --accent: #b4532a; --accent-doux: #f3e0d4; --vert: #3f6b4f; --vert-doux: #dfeadf;
    --or: #a77b16; --or-doux: #f5ebcf; --bleu: #3c5f86; --bleu-doux: #dfe7f1;
    --ombre: 0 1px 2px rgba(60,40,20,.06), 0 4px 14px rgba(60,40,20,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fond: #1b1816; --carte: #24201d; --texte: #efe7dc; --doux: #a89d91; --trait: #3a332d;
      --accent: #e08458; --accent-doux: #3d2a20; --vert: #8fc29f; --vert-doux: #22332a;
      --or: #e0b54f; --or-doux: #352c17; --bleu: #9cbbe0; --bleu-doux: #1f2a38;
      --ombre: none;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-padding-top: 70px; }
  body { margin: 0; background: var(--fond); color: var(--texte); font: 16px/1.55 Inter, system-ui, sans-serif; }
  a { color: var(--accent); }
  b { font-weight: 600; }
  h1, h2, h3 { font-family: Fraunces, Georgia, serif; line-height: 1.15; }

  /* --- En-tête et onglets --- */
  .entete { padding: max(18px, env(safe-area-inset-top)) 16px 6px; max-width: 760px; margin: 0 auto; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .entete a { text-decoration: none; color: inherit; }
  .logo { font: 700 26px/1 Fraunces, Georgia, serif; letter-spacing: -.01em; }
  .logo span { color: var(--accent); }
  .entete small { color: var(--doux); font-size: 13px; white-space: nowrap; }
  nav.onglets { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--fond) 92%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--trait); }
  nav.onglets .defile { max-width: 760px; margin: 0 auto; display: flex; gap: 6px; overflow-x: auto; padding: 8px 16px; scrollbar-width: none; }
  nav.onglets .defile::-webkit-scrollbar { display: none; }
  nav.onglets a { flex: none; padding: 7px 13px; border-radius: 999px; text-decoration: none; color: var(--doux); font-size: 14.5px; font-weight: 500; border: 1px solid transparent; }
  nav.onglets a[aria-current="page"] { background: var(--accent); color: #fff; }
  nav.onglets a.aujourdhui:not([aria-current="page"]) { border-color: var(--accent); color: var(--accent); }

  main { max-width: 760px; margin: 0 auto; padding: 18px 16px 80px; }
  .page[hidden] { display: none; }

  /* --- Titres de page --- */
  .surtitre { font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 6px 0 6px; font-weight: 600; }
  .page > h1 { font-size: clamp(28px, 7vw, 38px); margin: 0 0 10px; }
  .intro { color: var(--doux); margin: 0 0 16px; }

  /* --- Barre d'outils du jour --- */
  .outils { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 22px; }
  .bouton { font: inherit; font-size: 14px; padding: 8px 13px; border-radius: 999px; border: 1px solid var(--trait); background: var(--carte); color: var(--texte); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
  .bouton[aria-pressed="true"] { background: var(--bleu); border-color: var(--bleu); color: #fff; }
  .bouton.discret { background: transparent; color: var(--doux); }

  /* --- Créneaux --- */
  .creneau { position: relative; padding-left: 22px; margin-bottom: 26px; }
  .creneau::before { content: ""; position: absolute; left: 5px; top: 8px; bottom: -26px; width: 2px; background: var(--trait); }
  .creneau:last-child::before { bottom: 0; }
  .creneau::after { content: ""; position: absolute; left: 0; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--fond); border: 2px solid var(--accent); }
  .creneau.reserve::after { background: var(--vert); border-color: var(--vert); }
  .creneau .heure { font-size: 13px; color: var(--accent); font-weight: 600; letter-spacing: .02em; }
  .creneau h2 { font-size: 21px; margin: 2px 0 10px; }
  .resa-bandeau { display: flex; align-items: center; gap: 8px; background: var(--vert-doux); color: var(--vert); border-radius: 10px; padding: 8px 12px; font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  .resa-bandeau.todo { background: var(--or-doux); color: var(--or); }

  .options { display: grid; gap: 10px; }
  .option { background: var(--carte); border: 1px solid var(--trait); border-radius: 14px; padding: 14px 15px 12px; box-shadow: var(--ombre); transition: opacity .2s, border-color .2s; }
  .option.reco { border-color: color-mix(in srgb, var(--accent) 45%, var(--trait)); }
  .option.choisie { border-color: var(--vert); box-shadow: 0 0 0 2px var(--vert-doux); }
  .options.a-un-choix .option:not(.choisie) { opacity: .55; }
  .options.a-un-choix .option:not(.choisie):hover { opacity: .9; }
  body.pluie .option:not(.pluie-ok) { opacity: .5; }
  body.pluie .option.pluie-ok { border-color: var(--bleu); }
  .option h3 { font-family: Inter, system-ui, sans-serif; font-size: 16.5px; font-weight: 600; margin: 0 0 6px; }
  .option p { margin: 0 0 10px; font-size: 15px; }
  .etiquettes { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .etiquette { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--fond); color: var(--doux); border: 1px solid var(--trait); }
  .etiquette.reco { background: var(--accent); color: #fff; border-color: var(--accent); }
  .etiquette.pluie { background: var(--bleu-doux); color: var(--bleu); border-color: transparent; }
  .etiquette.vin { background: #f1dfe3; color: #8a3348; border-color: transparent; }
  .etiquette.medicis { background: var(--or-doux); color: var(--or); border-color: transparent; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .etiquette.vin { background: #3a222a; color: #e7a3b4; } }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .lien-fiche { font: inherit; font-size: 13.5px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--trait); background: var(--fond); color: var(--texte); cursor: pointer; text-align: left; }
  .lien-fiche::before { content: "📖 "; }
  .lien-fiche.resto::before { content: "🍽 "; }
  .choisir { margin-left: auto; font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 8px; border: 1px dashed var(--trait); background: transparent; color: var(--doux); cursor: pointer; }
  .choisie .choisir { border-style: solid; border-color: var(--vert); background: var(--vert); color: #fff; }

  .chemin { margin-top: 12px; background: var(--or-doux); border-radius: 12px; padding: 11px 14px; font-size: 14.5px; }
  .chemin strong { display: block; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--or); margin-bottom: 3px; }

  /* --- Cartes génériques --- */
  .bloc { background: var(--carte); border: 1px solid var(--trait); border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: var(--ombre); }
  .bloc h2 { font-size: 20px; margin: 0 0 10px; }
  .info { display: grid; grid-template-columns: 28px 1fr; gap: 4px 8px; margin: 0 0 10px; font-size: 15px; }
  .info:last-child { margin-bottom: 0; }
  .info .ic { font-size: 17px; }
  .info small { color: var(--doux); display: block; }
  .resa { border-left: 4px solid var(--trait); padding: 4px 0 4px 12px; margin: 0 0 14px; }
  .resa:last-child { margin-bottom: 0; }
  .resa.ok { border-color: var(--vert); } .resa.todo { border-color: var(--or); } .resa.info { border-color: var(--bleu); }
  .resa .statut { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .resa.ok .statut { color: var(--vert); } .resa.todo .statut { color: var(--or); } .resa.info .statut { color: var(--bleu); }
  .resa h3 { font-family: Inter, system-ui, sans-serif; font-size: 16px; margin: 2px 0; }
  .resa .quand { font-weight: 600; font-size: 14.5px; }
  .resa p { margin: 4px 0; font-size: 14.5px; color: var(--doux); }
  table.budget { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  table.budget td { padding: 7px 0; border-bottom: 1px solid var(--trait); vertical-align: top; }
  table.budget td:last-child { text-align: right; white-space: nowrap; padding-left: 12px; font-weight: 600; }
  .total { font-family: Fraunces, Georgia, serif; font-size: 19px; margin: 12px 0 6px; }
  ul.puces { margin: 8px 0 0; padding-left: 18px; font-size: 14.5px; }
  ul.puces li { margin-bottom: 6px; }
  .legende { display: flex; flex-wrap: wrap; gap: 6px; }

  /* --- Liste des lieux et des restos --- */
  .filtres { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; scrollbar-width: none; }
  .filtres::-webkit-scrollbar { display: none; }
  .filtres button { flex: none; font: inherit; font-size: 13.5px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--trait); background: var(--carte); color: var(--doux); cursor: pointer; }
  .filtres button[aria-pressed="true"] { background: var(--texte); color: var(--fond); border-color: var(--texte); }
  input.recherche { width: 100%; font: inherit; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--trait); background: var(--carte); color: var(--texte); margin-bottom: 10px; }
  .liste { display: grid; gap: 10px; }
  .item { display: block; width: 100%; text-align: left; font: inherit; color: inherit; background: var(--carte); border: 1px solid var(--trait); border-radius: 14px; padding: 13px 15px; cursor: pointer; box-shadow: var(--ombre); }
  .item h3 { font-size: 18px; margin: 0 0 3px; }
  .item p { margin: 0; color: var(--doux); font-size: 14.5px; }
  .item .meta { font-size: 12.5px; color: var(--accent); font-weight: 600; margin-bottom: 2px; }
  .resto h3 { font-family: Fraunces, Georgia, serif; font-size: 18px; margin: 0 0 2px; }
  .resto .ligne { font-size: 14px; color: var(--doux); margin: 2px 0; }
  .resto .note { font-size: 14.5px; margin: 8px 0 10px; }
  .resto .prix { color: var(--accent); font-weight: 600; }


  /* --- Récits audio --- */
  .btn-ecouter { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; font: inherit; color: var(--texte); background: var(--bleu-doux); border: 1.5px solid var(--bleu); border-radius: 14px; padding: 10px 14px; margin: 6px 0 12px; cursor: pointer; }
  .btn-ecouter .be-ic { font-size: 20px; }
  .btn-ecouter > span:nth-child(2) { flex: 1; display: flex; flex-direction: column; }
  .btn-ecouter b, .btn-ecouter .be-fl { color: var(--bleu); }
  .btn-ecouter small { opacity: .75; font-size: 12.5px; }
  .salle-corps .btn-ecouter { margin-top: 0; }
  #lecteur { position: fixed; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); z-index: 40; max-width: 744px; margin: 0 auto; display: flex; align-items: center; gap: 4px; padding: 8px 8px 8px 14px; border-radius: 16px; background: var(--bleu); color: #fff; box-shadow: 0 6px 24px rgba(0,0,0,.28); }
  #lecteur[hidden] { display: none; }
  #lecteur .lc-texte { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #lecteur .lc-texte b, #lecteur .lc-texte small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #lecteur .lc-texte small { opacity: .85; font-size: 12px; }
  #lecteur button { font: inherit; font-size: 17px; min-width: 36px; height: 38px; border: 0; border-radius: 999px; background: rgba(255,255,255,.14); color: #fff; cursor: pointer; padding: 0 8px; }
  #lecteur button:disabled { opacity: .35; }
  #lecteur #lc-vitesse { font-size: 13px; font-weight: 600; }
  #lecteur.attente #lc-jouer { background: #fff; color: var(--bleu); animation: lc-pouls 1.6s ease-in-out infinite; }
  @keyframes lc-pouls { 50% { transform: scale(1.1); } }
  @media (prefers-color-scheme: dark) { #lecteur { color: #12202f; } #lecteur button { color: #12202f; background: rgba(0,0,0,.12); } #lecteur.attente #lc-jouer { background: #12202f; color: var(--bleu); } }
  body.avec-lecteur { padding-bottom: 76px; }
  body.avec-lecteur .aller-maintenant { bottom: calc(80px + env(safe-area-inset-bottom)); }
  dialog.feuille #lecteur { position: sticky; left: auto; right: auto; bottom: calc(8px + env(safe-area-inset-bottom)); margin: 0 8px 8px; }
  @media print { #lecteur, .btn-ecouter { display: none; } }
  /* --- Fiche (feuille modale) --- */
  dialog.feuille { border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 760px; max-height: 92vh; border-radius: 18px 18px 0 0; background: var(--fond); color: var(--texte); }
  @media (min-width: 800px) { dialog.feuille { margin: auto; border-radius: 18px; max-height: 88vh; } }
  dialog.feuille::backdrop { background: rgba(20,14,10,.45); }
  .feuille .haut { position: sticky; top: 0; background: var(--fond); padding: 14px 16px 10px; border-bottom: 1px solid var(--trait); display: flex; gap: 12px; align-items: flex-start; z-index: 2; }
  .feuille .haut h2 { margin: 0; font-size: 23px; flex: 1; }
  .feuille .haut .meta { font-size: 12.5px; color: var(--accent); font-weight: 600; }
  .fermer { font: inherit; font-size: 22px; line-height: 1; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--trait); background: var(--carte); color: var(--texte); cursor: pointer; flex: none; }
  .feuille .corps { padding: 14px 16px calc(28px + env(safe-area-inset-bottom)); }
  .feuille h4 { font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin: 18px 0 6px; }
  .feuille .corps > p:first-child { margin-top: 0; }
  .histoire { margin: 0 0 10px; padding-left: 12px; border-left: 3px solid var(--accent-doux); }
  .pratique { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14.5px; background: var(--carte); border: 1px solid var(--trait); border-radius: 12px; padding: 12px 14px; }
  .pratique dt { color: var(--doux); }
  .pratique dd { margin: 0; }
  .liens { display: grid; gap: 8px; margin-top: 4px; }
  .liens a { display: flex; align-items: center; gap: 10px; padding: 10px 13px; border-radius: 12px; background: var(--carte); border: 1px solid var(--trait); text-decoration: none; color: var(--texte); font-size: 15px; }
  .liens a span.ic { font-size: 18px; }
  .liens a.resa-lien { border-color: var(--or); }


  /* --- Tout est repliable --- */
  details.bloc.repli { padding: 0 16px; }
  details.bloc.repli > summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; gap: 10px; padding: 14px 0; }
  details.bloc.repli > summary::-webkit-details-marker { display: none; }
  details.bloc.repli > summary h2 { margin: 0; font-size: 19px; flex: 1; }
  details.bloc.repli > summary small { color: var(--doux); font-size: 13px; text-align: right; }
  details.bloc.repli > summary::after { content: "▸"; color: var(--accent); }
  details.bloc.repli[open] > summary::after { content: "▾"; }
  details.bloc.repli[open] { padding-bottom: 16px; }
  details.bloc.repli.credits > summary { font-size: inherit; }
  details.intro-repli { margin: 0 0 14px; }
  details.intro-repli .intro { margin: 0; font-size: 15px; }
  .page > .outils:first-of-type, .page > .outils { margin-bottom: 12px; }
  .btn-tout[aria-pressed="true"] { background: var(--accent-doux); border-color: var(--accent); }
  /* Étapes principales : titre visible, détail au clic */
  .etape-ouvrir { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; width: 100%; text-align: left; font: inherit; background: transparent; border: 1.5px dashed var(--trait); border-radius: 12px; padding: 8px 12px; cursor: pointer; color: var(--texte); }
  .etape-ouvrir .eo-fl { color: var(--accent); font-weight: 600; font-size: 14px; }
  .etape-ouvrir small { color: var(--doux); font-size: 13px; }
  .etape.principale.ouvert > .etape-ouvrir { border-style: solid; border-color: var(--accent); background: var(--accent-doux); }
  .etape.principale:not(.ouvert) > .etape-corps { display: none; }
  .etape.principale.ouvert > .etape-corps { margin-top: 12px; animation: deplier .25s ease-out; }
  .etape.principale:not(.ouvert) { margin-bottom: 22px; }
  /* Restos repliés */
  details.repli-resto > summary { list-style: none; cursor: pointer; position: relative; padding-right: 22px; }
  details.repli-resto > summary::-webkit-details-marker { display: none; }
  details.repli-resto > summary::after { content: "▸"; position: absolute; right: 0; top: 50%; transform: translateY(-50%); color: var(--accent); font-size: 18px; }
  details.repli-resto[open] > summary::after { content: "▾"; }
  details.repli-resto[open] > summary { margin-bottom: 4px; }
  .plats details.plat { margin-top: 0; }
  .plats { gap: 8px; }
  /* Guide : salles repliées */
  details.salle { display: block; margin: 8px 0; border: 1px solid var(--trait); border-radius: 12px; background: var(--carte); }
  details.salle > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
  details.salle > summary::-webkit-details-marker { display: none; }
  details.salle .salle-num { flex: none; }
  details.salle .salle-titre { flex: 1; display: block; }
  details.salle .salle-nom { display: block; }
  details.salle .salle-h { display: block; font: 600 17px/1.2 Fraunces, Georgia, serif; margin-top: 2px; }
  details.salle .salle-fl { color: var(--accent); }
  details.salle[open] .salle-fl { transform: rotate(90deg); }
  details.salle > .salle-corps { padding: 0 12px 12px; }
  details.bloc-repli.conseil { margin-bottom: 4px; }
  details.bloc-repli.conseil .astuce { margin: 0; }


  /* --- Guide : « à ne pas manquer » intégré --- */
  .incontournables { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0 10px; }
  .inc-titre { font-size: 13px; font-weight: 700; color: var(--or); margin-right: 2px; }
  .inc-puce { font: inherit; font-size: 13.5px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--or); background: var(--or-doux); color: var(--texte); cursor: pointer; }
  .etoile { display: inline-block; font-size: 11.5px; font-weight: 700; letter-spacing: .02em; text-transform: none; color: var(--or); }
  .oeuvre-texte > .etoile { display: block; margin-bottom: 2px; }
  details.salle.a-voir-absolument { border-color: color-mix(in srgb, var(--or) 60%, var(--trait)); }
  details.salle { scroll-margin-top: 90px; }

  /* --- Lexique : mots cliquables et bulle --- */
  .terme { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; display: inline; text-align: inherit; cursor: pointer; text-decoration: underline dotted var(--accent); text-decoration-thickness: 1.5px; text-underline-offset: 3px; -webkit-tap-highlight-color: transparent; }
  .terme:hover, .terme:focus-visible { color: var(--accent); }
  .terme-demo { text-decoration: underline dotted var(--accent); text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
  dialog.bulle { border: 0; padding: 0; margin: auto auto calc(12px + env(safe-area-inset-bottom)); width: calc(100% - 24px); max-width: 540px; max-height: 72vh; border-radius: 16px; background: var(--carte); color: var(--texte); box-shadow: 0 12px 40px rgba(20,14,10,.3); display: none; flex-direction: column; }
  dialog.bulle[open] { display: flex; }
  @media (min-width: 800px) { dialog.bulle { margin: auto; } }
  dialog.bulle::backdrop { background: rgba(20,14,10,.3); }
  .bulle-tete { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px 6px; }
  .bulle-tete > div { flex: 1; }
  .bulle-sous { font-size: 12.5px; color: var(--accent); font-weight: 600; }
  .bulle-tete h3 { margin: 2px 0 0; font-size: 21px; }
  #bulle-corps { padding: 0 16px calc(16px + env(safe-area-inset-bottom)); overflow-y: auto; font-size: 15.5px; line-height: 1.55; }
  #bulle-corps p { margin: 6px 0 0; }
  .bulle-liens { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .bulle-liens a { font-size: 14px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--trait); background: var(--fond); color: var(--texte); text-decoration: none; }
  .lexique .lexique-liste { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; padding: 6px 0 4px; }
  .lex-item { font: inherit; text-align: left; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--trait); background: var(--carte); color: var(--texte); cursor: pointer; }
  .lex-item b { display: block; font-size: 15px; }
  .lex-item small { color: var(--doux); font-size: 12.5px; }
  details.lexique { margin-top: 18px; }

  footer { color: var(--doux); font-size: 13px; text-align: center; padding: 10px 16px 40px; }
  @media (min-width: 640px) { .options { grid-template-columns: 1fr 1fr; } .options .option:only-child { grid-column: 1 / -1; } }

  /* --- Parcours du jour (étapes) --- */
  .parcours { margin-top: 4px; }
  .etape { position: relative; padding-left: 24px; margin-bottom: 30px; scroll-margin-top: 64px; }
  .etape::before { content: ""; position: absolute; left: 5px; top: 8px; bottom: -30px; width: 2px; background: var(--trait); }
  .etape:last-child::before { bottom: 0; }
  .etape .heure { position: relative; }
  .etape .heure::before { content: ""; position: absolute; left: -24px; top: 3px; width: 12px; height: 12px; border-radius: 50%; background: var(--fond); border: 2px solid var(--accent); }
  .etape.reserve .heure::before { background: var(--vert); border-color: var(--vert); }
  .etape.type-repas .heure::before, .etape.type-apero .heure::before { border-color: var(--or); }
  .etape.maintenant .heure::before { background: var(--accent); box-shadow: 0 0 0 5px var(--accent-doux); }
  .etape.maintenant > h2 { color: var(--accent); }
  .etape .heure { font-size: 13px; color: var(--accent); font-weight: 600; letter-spacing: .02em; }
  .etape h2 { font-size: 22px; margin: 2px 0 8px; }
  .etape .texte { margin: 0 0 10px; font-size: 15.5px; }
  .pastille { display: inline-block; font-size: 11.5px; background: var(--accent); color: #fff; border-radius: 999px; padding: 1px 8px; font-weight: 600; letter-spacing: .02em; }
  .aller { margin: 0 0 12px; padding: 10px 12px; border: 1.5px dashed var(--trait); border-radius: 12px; font-size: 14px; }
  .aller-haut { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .aller .via { color: var(--doux); font-size: 13.5px; margin-top: 4px; }
  .sous-titre { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--or); font-weight: 700; margin: 16px 0 8px; }
  .regards, .detours { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .regard, .detours li { background: var(--carte); border: 1px solid var(--trait); border-radius: 14px; padding: 12px 14px; box-shadow: var(--ombre); }
  .point-ecouter { margin-top: 8px; font: inherit; font-size: 13.5px; font-weight: 600; color: var(--bleu); background: var(--bleu-doux); border: 1px solid var(--bleu); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .regard.avec-photo { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: start; }
  .regard.avec-photo:has(.photo.ko) { grid-template-columns: 1fr; }
  .regard b, .detours b { font-weight: 600; }
  .regard p, .detours p { margin: 4px 0 0; font-size: 14.5px; }
  .pin { text-decoration: none; font-size: 15px; padding: 2px 4px; margin-left: 2px; border-radius: 6px; white-space: nowrap; }
  .pin:active { background: var(--trait); }
  .detours .duree { color: var(--accent); font-size: 13px; font-weight: 600; }
  .detours .actions { margin-top: 8px; }


  /* --- Vue essentielle : temps forts visibles, le reste replié --- */
  .moment { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--doux); font-weight: 700; margin: 26px 0 12px; padding-bottom: 4px; border-bottom: 1px solid var(--trait); }
  .moment:first-child { margin-top: 6px; }
  .route-resume { display: none; width: 100%; text-align: left; font: inherit; color: var(--doux); background: transparent; border: 1.5px dashed var(--trait); border-radius: 12px; padding: 8px 12px; cursor: pointer; }
  .route-resume span { display: block; font-size: 14px; color: var(--texte); }
  .route-resume small { font-size: 12.5px; color: var(--accent); }
  body:not(.detail) .etape.route { margin-bottom: 14px; }
  body:not(.detail) .etape.route .route-resume { display: block; }
  body:not(.detail) .etape.route:not(.ouvert):not(.maintenant) .route-corps { display: none; }
  body:not(.detail) .etape.route .route-resume { margin-bottom: 0; }
  body:not(.detail) .etape.route .heure::before { width: 8px; height: 8px; left: -22px; top: 5px; }
  body:not(.detail) .etape.route::before { opacity: .6; }
  .etape .a-voir { margin: -4px 0 10px; font-size: 14.5px; color: var(--doux); font-style: italic; }
  .carte-guide { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; font: inherit; color: var(--texte); background: var(--accent-doux); border: 1.5px solid var(--accent); border-radius: 14px; padding: 11px 14px; margin: 6px 0 12px; cursor: pointer; box-shadow: var(--ombre); }
  .carte-guide b, .carte-guide .cg-fl { color: var(--accent); }
  .carte-guide small { color: var(--texte); opacity: .75; }
  .carte-guide.fiche { background: var(--carte); border: 1px solid var(--trait); }
  .carte-guide.fiche small { color: var(--doux); opacity: 1; }
  .carte-guide.fiche .cg-fl { color: var(--accent); }
  .carte-guide .cg-ic { font-size: 26px; }
  .carte-guide b { display: block; font-size: 16.5px; }
  .carte-guide.fiche b { color: var(--texte); }
  .carte-guide small { display: block; font-size: 13px; }
  .carte-guide .cg-fl { margin-left: auto; font-size: 26px; }
  details.bloc-repli { margin-top: 10px; border: 1px solid var(--trait); border-radius: 14px; padding: 0 12px; background: color-mix(in srgb, var(--carte) 55%, transparent); }
  details.bloc-repli > summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 11px 0; font-weight: 600; font-size: 14.5px; }
  details.bloc-repli > summary::-webkit-details-marker { display: none; }
  details.bloc-repli > summary::after { content: "▸"; color: var(--accent); margin-left: 6px; }
  details.bloc-repli[open] > summary::after { content: "▾"; }
  details.bloc-repli > summary small { margin-left: auto; color: var(--doux); font-weight: 400; font-size: 13px; }
  details.bloc-repli[open] { padding-bottom: 12px; }
  details.bloc-repli.place > summary span { color: var(--accent); }
  details.bloc-repli .sous-titre:first-child, details.bloc-repli > .aller { margin-top: 0; }

  /* Étape « en chemin » dépliée : panneau décalé à droite, avec sa propre ligne */
  body:not(.detail) .etape.route.ouvert .route-resume { border-style: solid; border-color: var(--accent); background: var(--accent-doux); border-radius: 12px 12px 12px 0; }
  body:not(.detail) .etape.route.ouvert .route-resume small { visibility: visible; }
  body:not(.detail) .etape.route.ouvert .route-corps { margin: 0 0 0 18px; padding: 14px 0 6px 18px; border-left: 3px solid var(--accent); position: relative; animation: deplier .25s ease-out; }
  body:not(.detail) .etape.route.ouvert .route-corps::after { content: ""; position: absolute; left: -9px; bottom: -4px; width: 15px; height: 15px; border-radius: 50%; background: var(--accent); }
  body:not(.detail) .etape.route .route-corps > .heure, body:not(.detail) .etape.route .route-corps > h2 { display: none; }
  details.bloc-repli[open] > :not(summary) { margin-left: 4px; padding-left: 12px; border-left: 3px solid var(--accent-doux); }
  @keyframes deplier { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
  /* --- Photos --- */
  .photo { display: block; border-radius: 10px; overflow: hidden; background: var(--trait); }
  .photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .photo.ko { display: none; }
  .photo.vignette { width: 96px; height: 124px; }
  .photo.grande { background: transparent; border-radius: 8px; margin: 4px 0 8px; display: flex; justify-content: center; }
  .photo.grande img { width: auto; height: auto; max-width: 100%; max-height: 360px; object-fit: contain; border-radius: 8px; }
  .photo.entete { margin: -14px -16px 14px; border-radius: 0; height: 220px; }
  .galerie { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-top: 14px; }
  .photo.galerie { height: 140px; }
  @media (min-width: 640px) { .photo.vignette { width: 130px; height: 160px; } .regard.avec-photo { grid-template-columns: 130px 1fr; } .photo.entete { height: 300px; } }

  /* --- Repas : trois choix --- */
  .repas { display: grid; gap: 10px; margin: 10px 0; }
  @media (min-width: 640px) { .repas { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); } }
  .choix { background: var(--carte); border: 1px solid var(--trait); border-radius: 14px; padding: 12px 14px; box-shadow: var(--ombre); }
  .choix.reco { border-color: color-mix(in srgb, var(--accent) 55%, var(--trait)); box-shadow: 0 0 0 2px var(--accent-doux); }
  .choix h3 { font: 600 17px/1.2 Fraunces, Georgia, serif; margin: 6px 0 2px; }
  .choix .ligne { font-size: 13px; color: var(--doux); }
  .choix p { font-size: 14.5px; margin: 8px 0 10px; }
  .choix-haut { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .gamme { font-weight: 700; font-size: 12.5px; padding: 2px 9px; border-radius: 999px; background: var(--vert-doux); color: var(--vert); }
  .gamme.g2 { background: var(--or-doux); color: var(--or); }
  .gamme.g3 { background: var(--accent-doux); color: var(--accent); }
  .gamme.g0 { background: var(--bleu-doux); color: var(--bleu); }
  .etiquette.prio { background: var(--texte); color: var(--fond); border-color: transparent; }
  .petit-btn { font-size: 13px; padding: 5px 10px; }
  .lien-fiche.guide::before { content: "🎧 "; }

  /* --- Autres options et plans B --- */
  details.autres { margin-top: 12px; }
  details.autres summary { cursor: pointer; font-size: 14px; color: var(--doux); padding: 6px 0; }
  details.autres .options { margin-top: 6px; }
  body.pluie details.a-pluie summary { color: var(--bleu); font-weight: 600; }
  .plans-b .option { margin-bottom: 10px; }
  .plans-b .option:last-child { margin-bottom: 0; }
  .aller-maintenant { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 15; background: var(--accent); color: #fff; padding: 10px 16px; border-radius: 999px; text-decoration: none; font-weight: 600; font-size: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.2); }

  /* --- Accueil --- */
  .maintenant-carte { display: block; background: var(--accent); color: #fff; border-radius: 14px; padding: 14px 16px; margin: 4px 0 18px; text-decoration: none; }
  .maintenant-carte .pastille { background: rgba(255,255,255,.22); }
  .maintenant-carte.calme { background: var(--carte); color: var(--texte); border: 1px solid var(--trait); }
  .maintenant-carte.calme .pastille { background: var(--accent); }
  .maintenant-carte b { display: block; font: 600 18px/1.25 Fraunces, Georgia, serif; margin: 8px 0 2px; }
  .maintenant-carte small { opacity: .85; }
  .jour-lien { display: grid; grid-template-columns: 62px 1fr auto; gap: 8px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--trait); text-decoration: none; color: var(--texte); font-size: 15px; }
  .jour-lien:last-child { border-bottom: 0; padding-bottom: 0; }
  .jour-lien b { color: var(--accent); }
  .jour-lien small { color: var(--doux); font-size: 12.5px; }
  .checks { display: grid; gap: 10px; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; cursor: pointer; }
  .check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--vert); flex: none; }
  .check input:checked + span { color: var(--doux); text-decoration: line-through; }
  .petit { font-size: 13.5px; color: var(--doux); }
  .bouton:disabled { opacity: .5; }
  .credits summary { cursor: pointer; font-weight: 600; font-family: Fraunces, Georgia, serif; font-size: 18px; }
  .credits ul { font-size: 12px; padding-left: 18px; margin: 8px 0 0; }
  .credits li { margin-bottom: 3px; overflow-wrap: anywhere; }

  /* --- Manger --- */
  .gammes { display: grid; gap: 10px; margin-bottom: 14px; }
  #filtres-manger { scroll-margin-top: 64px; }
  @media (min-width: 640px) { .gammes { grid-template-columns: repeat(3, 1fr); } }
  .gamme-carte { text-align: left; font: inherit; color: inherit; background: var(--carte); border: 1px solid var(--trait); border-radius: 14px; padding: 14px; cursor: pointer; box-shadow: var(--ombre); display: flex; flex-direction: column; gap: 4px; }
  .gamme-carte b { font: 600 19px/1.2 Fraunces, Georgia, serif; }
  .gamme-carte small { color: var(--doux); font-size: 13.5px; }
  .gamme-carte .tops { font-size: 13px; color: var(--accent); font-weight: 600; margin-top: 4px; }
  .gamme-carte .gamme { align-self: flex-start; }
  /* Gammes compactes : une ligne de trois boutons, le détail est dans les restos */
  .gammes { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .gamme-carte { padding: 10px; align-items: flex-start; }
  .gamme-carte b { font-size: 15px; }
  .gamme-carte small, .gamme-carte .tops { display: none; }
  .gamme-carte[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-doux); }
  .resto .quand { color: var(--accent); font-weight: 600; }
  .resto h3 { margin: 6px 0 2px; }
  .astuce { font-size: 14px; background: var(--or-doux); border-radius: 10px; padding: 8px 12px; }
  .commander { margin-top: 0; }
  .commander li { margin-bottom: 3px; }
  .plats { display: grid; gap: 16px; }
  .plat h3 { font: 600 17px/1.2 Fraunces, Georgia, serif; margin: 0 0 4px; }
  .plat p { margin: 0 0 8px; font-size: 14.5px; }

  /* --- Lieux (liste) --- */
  .item.avec-photo { display: grid; grid-template-columns: 72px 1fr; gap: 12px; align-items: center; }
  .item img { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; background: var(--trait); }

  /* --- Guide de visite (dans la fiche) --- */
  .salle { display: grid; grid-template-columns: 28px 1fr; gap: 10px; margin: 18px 0; }
  .salle-num { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
  .salle-nom { font-size: 12px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .salle h5 { font: 600 19px/1.2 Fraunces, Georgia, serif; margin: 2px 0 8px; }
  .oeuvre { margin: 8px 0 16px; padding-bottom: 14px; border-bottom: 1px solid var(--trait); }
  .oeuvre:last-child { border-bottom: 0; }
  .oeuvre-texte b { font-weight: 600; font-size: 15.5px; }
  .oeuvre-texte .auteur { display: block; color: var(--doux); font-size: 13px; }
  .oeuvre-texte p { margin: 4px 0 0; font-size: 15px; }

  @media print { nav.onglets, .outils, .choisir, .aller-maintenant { display: none; } .page[hidden] { display: block; } details { display: block; } }

  /* Plan interactif des musées */
  .plan { margin: 12px 0 14px; border: 1px solid var(--trait); border-radius: 14px; background: var(--carte); padding: 10px; box-shadow: var(--ombre); }
  .pl-tete { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .pl-tete small { color: var(--or); font-weight: 600; }
  .pl-onglets { display: flex; gap: 6px; margin-bottom: 8px; }
  .pl-onglet { flex: 1; display: flex; flex-direction: column; align-items: center; border: 1px solid var(--trait); background: var(--fond); color: var(--texte); border-radius: 12px; padding: 6px 8px; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; }
  .pl-onglet small { font-weight: 400; font-size: 11.5px; color: var(--doux); }
  .pl-onglet.actif { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pl-onglet.actif small { color: #fff; opacity: .85; }
  .pl-svg { display: none; width: 100%; height: auto; -webkit-tap-highlight-color: transparent; }
  .pl-svg.actif { display: block; }
  .pl-svg text { font-family: inherit; text-anchor: middle; pointer-events: none; }
  .pl-svg text.gauche, .pl-svg .pl-txt { text-anchor: start; }
  .pl-svg .pl-txt.pl-c { text-anchor: middle; }
  .pl-cour { fill: var(--fond); stroke: var(--trait); stroke-dasharray: 3 3; }
  .pl-couloir { fill: var(--accent-doux); }
  .pl-eau { fill: var(--bleu-doux); }
  .pl-eau-t { fill: var(--bleu); font-style: italic; }
  .pl-route { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 4; opacity: .8; }
  .pl-fleche { fill: var(--accent); }
  .pl-txt { fill: var(--doux); font-size: 10px; }
  .pl-salle { cursor: pointer; outline: none; }
  .pl-salle .f { fill: var(--carte); stroke: var(--doux); stroke-width: 1.2; transition: fill .15s; }
  .pl-salle .n { font-size: 12px; font-weight: 700; fill: var(--texte); }
  .pl-salle .s { font-size: 10px; fill: var(--texte); }
  .pl-salle .ic { font-size: 13px; }
  .pl-salle.sec .f { fill: var(--fond); stroke: var(--trait); }
  .pl-salle.sec text { fill: var(--doux); }
  .pl-salle.top .f { fill: var(--or-doux); stroke: var(--or); stroke-width: 1.8; }
  .pl-salle.pl-zone .f { fill: var(--vert-doux); stroke: var(--vert); }
  .pl-et { fill: var(--or); font-size: 12px; }
  .pl-salle.choisie .f { stroke: var(--accent); stroke-width: 3; }
  .pl-salle .pl-pt { display: none; fill: var(--vert); stroke: var(--carte); stroke-width: 1.5; }
  .pl-salle.ici .pl-pt { display: block; animation: pl-pouls 1.4s ease-in-out infinite; }
  .pl-salle.ici .f { stroke: var(--vert); stroke-width: 3; }
  @keyframes pl-pouls { 50% { opacity: .3; } }
  .pl-legende { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 6px 2px 0; font-size: 12px; color: var(--doux); }
  .pl-legende .lg { display: inline-block; width: 12px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; background: var(--carte); border: 1.2px solid var(--doux); }
  .pl-legende .lg.top { background: var(--or-doux); border-color: var(--or); }
  .pl-legende .lg.sec { background: var(--fond); border-color: var(--trait); }
  .pl-legende .lg.rt { border: none; border-top: 2px dashed var(--accent); border-radius: 0; height: 0; width: 16px; vertical-align: 3px; }
  .pl-info { margin-top: 8px; padding: 10px 12px; border-radius: 10px; background: var(--fond); }
  .pl-info p { margin: 6px 0; }
  .pl-aide { color: var(--doux); font-size: 14px; }
  .pl-i-tete { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
  .pl-i-tete b { font: 600 17px/1.2 Fraunces, Georgia, serif; }
  .pl-num { font-size: 12px; font-weight: 700; color: #fff; background: var(--accent); border-radius: 999px; padding: 1px 8px; }
  .pl-sec { font-size: 12px; color: var(--doux); }
  .pl-ici.on { background: var(--vert); border-color: var(--vert); color: #fff; }
  .pl-suite { font-size: 14px; }
  .pl-lien { font: inherit; font-weight: 700; color: var(--accent); background: none; border: none; padding: 0; text-decoration: underline; cursor: pointer; text-align: left; }
  .pl-note { margin: 8px 2px 0; font-size: 12px; }
  .pl-voir-l { margin: 0 0 8px; }
  details.bloc-repli.plus ul.regards, details.bloc-repli.plus ul.detours { padding-left: 0; margin-left: 0; }
</style>
</head>
<body>
<header class="entete">
  <a href="#accueil" class="logo">Florence<span>.</span></a>
  <small id="sous-titre">10 → 13 octobre 2026</small>
</header>
<nav class="onglets" aria-label="Sections"><div class="defile" id="onglets"></div></nav>
<main id="contenu"></main>
<footer id="pied"></footer>

<dialog class="feuille" id="feuille" aria-labelledby="feuille-titre">
  <div class="haut"><div style="flex:1"><div class="meta" id="feuille-meta"></div><h2 id="feuille-titre"></h2></div><button class="fermer" id="fermer" aria-label="Fermer">×</button></div>
  <div class="corps" id="feuille-corps"></div>
</dialog>

<dialog class="bulle" id="bulle" aria-labelledby="bulle-titre">
  <div class="bulle-tete"><div><div class="bulle-sous" id="bulle-sous"></div><h3 id="bulle-titre"></h3></div><button class="fermer" id="bulle-fermer" aria-label="Fermer">×</button></div>
  <div id="bulle-corps"></div>
</dialog>

<script src="donnees.js"></script>
<script src="lexique.js"></script>
<script src="audio.js"></script>
<script src="app.js"></script>
</body>
</html>
